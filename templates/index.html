<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
    <title>CrewSignal</title>
  </head>
  <body>
    <div class="container py-4">
      <header class="hero p-4 mb-4 rounded text-white">
        <div class="d-flex align-items-center">
          <div class="flex-grow-1">
            <h1 class="display-4 mb-0">CrewSignal</h1>
            <p class="lead mb-0">Personal Health Trend Support for Long-Duration Missions</p>
          </div>
        </div>
      </header>
      <div class="mb-3" id="connectivity">
        <div class="connect-item">Browser Online: <span id="onlineStatus">?</span></div>
        <div class="connect-item">Server Reachable: <span id="serverStatus">?</span></div>
        <div class="connect-item">Local Storage: <span id="localStorageStatus">?</span></div>
      </div>
      <form method="post" action="/predict" id="inputForm" novalidate>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="astronaut_id">Astronaut ID</label>
            <input type="text" class="form-control" id="astronaut_id" name="astronaut_id" required pattern="[A-Za-z0-9]+">
          </div>
          <div class="form-group col-md-6">
            <label for="astronaut_name">Astronaut Name</label>
            <input type="text" class="form-control" id="astronaut_name" name="astronaut_name" required pattern="[A-Za-z0-9 ]+">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group col-md-4">
            <label for="age">Age</label>
            <input type="number" class="form-control" id="age" name="age" min="0" required>
          </div>
          <div class="form-group col-md-4">
            <label for="sex">Sex</label>
            <select class="form-control" id="sex" name="sex" required>
              <option>Male</option>
              <option>Female</option>
              <option>Others</option>
            </select>
          </div>
          <div class="form-group col-md-4">
            <label for="pulse">Pulse</label>
            <input type="number" class="form-control" id="pulse" name="pulse" min="0" step="any" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="body_temperature">Body Temperature (°C)</label>
            <input type="number" class="form-control" id="body_temperature" name="body_temperature" min="0" step="any" required>
          </div>
          <div class="form-group col-md-6">
            <label for="spo2">SpO2 (%)</label>
            <input type="number" class="form-control" id="spo2" name="spo2" min="0" step="any" required>
          </div>
        </div>
        <div class="text-center mt-3">
          <button type="submit" class="btn btn-primary btn-lg">Predict</button>
        </div>
      </form>
    </div>
    <script>
      function updateConnectivity(){
        document.getElementById('onlineStatus').textContent = navigator.onLine ? 'Yes' : 'No'
        const controller = new AbortController()
        const id = setTimeout(()=>controller.abort(), 3000)
        fetch('/health',{signal:controller.signal}).then(r=>{
          clearTimeout(id)
          document.getElementById('serverStatus').textContent = r.ok ? 'Reachable' : 'Unreachable'
        }).catch(e=>{
          document.getElementById('serverStatus').textContent = 'Unreachable'
        })
        try{
          const ts = localStorage.getItem('crew_last_sync')
          document.getElementById('localStorageStatus').textContent = ts ? ('Last sync: '+ts) : 'No sync record'
        }catch(e){
          document.getElementById('localStorageStatus').textContent = 'Unavailable'
        }
      }
      window.addEventListener('online', updateConnectivity)
      window.addEventListener('offline', updateConnectivity)
      updateConnectivity()
    </script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
